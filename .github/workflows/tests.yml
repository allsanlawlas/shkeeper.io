name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            lockfile: requirements-py311-dev.lock
          - python: "3.13"
            lockfile: requirements-py313-dev.lock

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r "${{ matrix.lockfile }}"

      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -v
